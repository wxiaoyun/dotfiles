[settings]
cache_prune_age = "7d"

[bootstrap.packages]
"brew:git" = "latest"
"brew:zoxide" = "latest"
"brew:eza" = "latest"
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:jq" = "latest"
"brew:fzf" = "latest"
"brew:superfile" = "latest"
"brew:mise" = "latest"
"brew:usage" = "latest"
"brew:tlrc" = "latest"
"brew:fastfetch" = "latest"
"brew:dua-cli" = "latest"
"brew:herdr" = "latest"
"brew:neovim" = "latest"
"brew:node" = "latest"
"brew:python@3.14" = "latest"
"brew:rustup" = "latest"
"brew:pi-coding-agent" = "latest"

[dotfiles]
"~/.bash_profile" = "dotfiles/home/bash_profile"
"~/.bashrc" = "dotfiles/home/bashrc"
"~/.zshrc" = "dotfiles/home/zshrc"
"~/.zprofile" = "dotfiles/home/zprofile"
"~/.zshenv" = "dotfiles/home/zshenv"
"~/.p10k.zsh" = "dotfiles/home/p10k.zsh"
"~/.tmux.conf" = "dotfiles/home/tmux.conf"
"~/.agents" = { source = "dotfiles/agents", mode = "symlink-each" }
"~/.claude" = { source = "dotfiles/claude", mode = "copy" }
"~/.codex" = { source = "dotfiles/agents", mode = "copy" }
"~/.local/bin" = { source = "dotfiles/local-bin", mode = "symlink-each" }
"~/.config" = { source = "dotfiles/config", mode = "symlink-each", exclude = [
  "nvim",
  "shell",
  "ghostty",
] }
"~/.config/nvim" = "dotfiles/config/nvim"
"~/.config/shell" = { source = "dotfiles/config/shell", mode = "symlink-each" }
"~/.config/ghostty" = { source = "dotfiles/config/ghostty", mode = "symlink-each" }

[bootstrap.hooks.pre-dotfiles]
run = """
mkdir -p \"$HOME/.local/bin\"
"""

[bootstrap.hooks.post-dotfiles]
run = """
ln -sf ~/.agents/AGENTS.md ~/.pi/agent/AGENTS.md
"""

[tasks.os-bootstrap]
hide = true
run = ":"

[tasks.bootstrap]
description = "Install shared agent peripherals"
depends = ["os-bootstrap"]
run = [
  { task = "setup-harness-peripherals" },
  { task = "add-skills" },
]

[tasks.setup-harness-peripherals]
run = """
herdr integration install pi
herdr integration install claude

pi install npm:pi-web-access
pi install git:github.com/wxiaoyun/herdr-agents
pi install npm:@juicesharp/rpiv-ask-user-question
pi install git:github.com/DietrichGebert/ponytail
pi install npm:pi-tidy

claude plugin marketplace add jarrodwatts/claude-hud
claude plugin marketplace add DietrichGebert/ponytail
claude plugin install claude-hud
claude plugin install ponytail@ponytail
"""

[tasks.add-skills]
env.AGENTS = "universal claude-code"
env.AGENT_SKILLS = """
mattpocock/skills --skill research --skill domain-modeling --skill grilling --skill grill-with-docs --skill code-review --skill pr --skill retro --skill writing-for-agents
wxiaoyun/skills --skill tribal-knowledge
"""
file = "{{ cwd }}/scripts/add-agent-skills.sh"
